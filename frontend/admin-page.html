<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Beheervoorbeeld van een opgeslagen bram-html-pagina." />
    <title>Voorbeeld van opgeslagen pagina · bram-html</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Terug naar bram-html">
        <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
        <span class="brand-name">bram-html</span>
      </a>
      <a class="header-button" href="/admin">Terug naar het beheeroverzicht</a>
    </header>

    <main class="admin-page-main">
      <div class="admin-state" id="page-state" role="status">Opgeslagen pagina laden…</div>
      <div id="page-detail" hidden>
        <div class="admin-page-heading">
          <div>
            <p class="eyebrow">VOORBEELD VAN OPGESLAGEN PAGINA</p>
            <h1 id="page-title"></h1>
            <p>Opgeslagen door <strong id="page-owner"></strong> · Bijgewerkt op <span id="page-updated"></span></p>
          </div>
        </div>
        <section class="admin-preview-card" aria-labelledby="preview-title">
          <h2 class="sr-only" id="preview-title">Weergave van opgeslagen pagina</h2>
          <iframe id="page-preview" title="Voorbeeld van opgeslagen pagina" sandbox referrerpolicy="no-referrer"></iframe>
        </section>
      </div>
    </main>

    <script src="/admin-page.js"></script>
  </body>
</html>

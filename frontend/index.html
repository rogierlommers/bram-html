<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="bram-html is a friendly HTML and CSS playground for young learners." />
    <title>bram-html</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="bram-html home">
        <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
        <span class="brand-name">bram-html</span>
      </a>
      <div class="account-actions">
        <span class="user-email" id="user-email" hidden></span>
        <a class="header-button admin-link" id="admin-link" href="/admin" hidden>Admin</a>
        <button class="header-button" id="pages-button" type="button" hidden>My pages</button>
        <button class="header-button primary" id="auth-button" type="button">Sign in</button>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div>
          <h1 id="page-title">What will you build today?</h1>
        </div>
        <div class="intro-actions">
          <button class="save-button" id="save-button" type="button">Save page</button>
        </div>
      </section>

      <section class="lesson-strip" aria-label="Quick lessons">
        <button class="lesson active" type="button" data-lesson="blank">
          <span class="lesson-number">01</span>
          <span><strong>Blank page</strong><small>Start from scratch</small></span>
        </button>
        <button class="lesson" type="button" data-lesson="welcome">
          <span class="lesson-number">02</span>
          <span><strong>Say hello</strong><small>Headings &amp; text</small></span>
        </button>
        <button class="lesson" type="button" data-lesson="colors">
          <span class="lesson-number">03</span>
          <span><strong>Play with color</strong><small>CSS styles</small></span>
        </button>
        <button class="lesson" type="button" data-lesson="card">
          <span class="lesson-number">04</span>
          <span><strong>Build a card</strong><small>Boxes &amp; spacing</small></span>
        </button>
      </section>

      <section class="workspace" aria-label="Coding playground">
        <div class="panel code-panel">
          <div class="panel-header">
            <div>
              <span class="status-dot coral" aria-hidden="true"></span>
              <h2>Page</h2>
            </div>
            <label class="page-title-label">
              <span class="sr-only">Select a page</span>
              <select id="page-select">
                <option value="new">New page</option>
              </select>
            </label>
            <button class="text-button" id="reset-button" type="button">↻ Reset</button>
          </div>
          <div class="editor-wrap">
            <label class="sr-only" for="code-editor">HTML and CSS code</label>
            <textarea id="code-editor" spellcheck="false" autocapitalize="off" aria-describedby="editor-tip"></textarea>
          </div>
          <p class="panel-tip" id="editor-tip"><span aria-hidden="true">🧑‍💻</span> source code here.</p>
        </div>

        <div class="panel preview-panel">
          <div class="panel-header">
            <div>
              <span class="status-dot green" aria-hidden="true"></span>
              <h2>Live preview</h2>
            </div>
            <span class="live-label">LIVE</span>
          </div>
          <iframe id="preview" title="Live preview of your code" sandbox="allow-modals"></iframe>
          <p class="panel-tip"><span aria-hidden="true">✨</span> rendered html here.</p>
        </div>
      </section>
    </main>

    <dialog class="modal" id="auth-dialog" aria-labelledby="auth-title">
      <form class="modal-card" id="auth-form">
        <button class="modal-close" type="button" data-close="auth-dialog" aria-label="Close">×</button>
        <p class="eyebrow">SAVE YOUR CREATIONS</p>
        <h2 id="auth-title">Sign in to bram-html</h2>
        <p id="auth-description">Enter an email address. We’ll send you a six-digit sign-in code.</p>
        <label class="field-label" for="email-input">Email address</label>
        <input class="field-input" id="email-input" name="email" type="email" autocomplete="email" required />
        <label class="field-label" id="code-label" for="code-input" hidden>Sign-in code</label>
        <input class="field-input" id="code-input" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" hidden />
        <button class="modal-action" id="auth-submit" type="submit">Email my sign-in code</button>
        <div class="auth-progress" id="auth-progress" role="progressbar" aria-label="Sending sign-in email" hidden>
          <span></span>
        </div>
        <button class="text-button" id="auth-back" type="button" hidden>Use another email</button>
        <p class="form-message" id="auth-message" role="status"></p>
      </form>
    </dialog>

    <dialog class="modal" id="save-dialog" aria-labelledby="save-title">
      <form class="modal-card" id="save-form">
        <button class="modal-close" type="button" data-close="save-dialog" aria-label="Close">×</button>
        <p class="eyebrow">SAVE YOUR CREATION</p>
        <h2 id="save-title">Name your page</h2>
        <label class="field-label" for="page-name-input">Page name</label>
        <input class="field-input" id="page-name-input" name="page-name" maxlength="100" required />
        <button class="modal-action" type="submit">Save page</button>
        <p class="form-message" id="save-message" role="status"></p>
      </form>
    </dialog>

    <dialog class="modal pages-modal" id="pages-dialog" aria-labelledby="pages-title">
      <div class="modal-card">
        <button class="modal-close" type="button" data-close="pages-dialog" aria-label="Close">×</button>
        <p class="eyebrow">YOUR COLLECTION</p>
        <h2 id="pages-title">Saved pages</h2>
        <div class="saved-pages" id="saved-pages"></div>
        <p class="form-message" id="pages-message" role="status"></p>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <footer>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
